      description: 'Download a liquidación as a PDF document.

        **CURRENTLY NOT IMPLEMENTED** — returns 501 Not Implemented

        pending PDF generation infrastructure.

        '
      operationId: downloadLiquidacionPdf
      parameters:
      - name: id
        in: path
        required: true
