      responses:
        '200':
          description: Unit balance summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitBalanceResponse'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /payments/unit/{unit_id}/history:
    get:
