          minLength: 1
          description: 'Administrator''s digital signature.

            Required for the certificado to be an executive title under CCC Art. 2048 ¶4.

            '
        consejo_approval:
          type: string
          nullable: true
          description: Optional approval reference from the consejo de propietarios.
    SignCertificadoRequest:
