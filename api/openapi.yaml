      - category_id
      - concept_id
      - item
      - term
      - total_terms
      - provider_id
      - cost
      - expense_type
      - approval_status
      - hash
      - version
      - created_at
      - created_by
      - tombstone
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        consorcio_id:
          $ref: '#/components/schemas/UUID'
        period_code:
          type: string
          description: YYYYMM period code.
        category_id:
          $ref: '#/components/schemas/UUID'
        concept_id:
          $ref: '#/components/schemas/UUID'
        item:
          type: string
        term:
          type: integer
          minimum: 1
          description: Current installment number (1-indexed).
        total_terms:
          type: integer
          minimum: 1
