          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /incomes-outputs/{entry_id}/cancel:
    put:
      summary: Cancel an entry
      description: 'Cancels an entry (append-only tombstone). Creates a new version with

        `status = CANCELLED` and `tombstone = true`. Cannot cancel an already

        cancelled entry.

        '
      operationId: cancelEntry
      tags:
      - IncomesOutputs
      - Entries
      security:
      - bearerAuth:
        - ADMIN
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Entry ID.
      - name: consorcio_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The consorcio ID.
      responses:
        '200':
          description: Cancelled entry (new tombstone version).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeOutputResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
  /incomes-outputs/summary/{period_code}:
    get:
      summary: Get single-period financial summary
      description: 'Returns the financial summary for a specific period:

        total income, total output, and net flow (income - output).

        Only ACTIVE entries are included.

        '
