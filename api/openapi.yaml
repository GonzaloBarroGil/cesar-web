      description: Retrieve the latest version of a single entry by ID.
      operationId: getEntry
      tags:
      - IncomesOutputs
      - Entries
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Entry ID.
      - name: consorcio_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The consorcio ID.
      responses:
        '200':
          description: Entry details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeOutputResponse'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    put:
      summary: Update an entry
      description: 'Creates a new version of the entry (append-only). Only provided fields

        are changed. Direction is immutable and cannot be changed via update.

        Cannot update a CANCELLED entry.

        '
      operationId: updateEntry
      tags:
      - IncomesOutputs
      - Entries
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Entry ID.
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: consorcio_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The consorcio ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeOutputUpdate'
      responses:
        '200':
          description: Updated entry (new version).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeOutputResponse'
