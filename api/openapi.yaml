          type: integer
          minimum: 0
          description: Display order of the line item.
          example: 1
        descripcion:
          type: string
          minLength: 1
          description: Description of the item/service.
          example: Expensas comunes junio 2026
        cantidad:
          type: number
          format: decimal
          minimum: 0
          description: Quantity (non-negative).
          example: 1.0
        unidad_medida:
          type: string
          description: Unit of measure (e.g. "unidades", "horas").
          example: unidades
        precio_unitario:
          $ref: '#/components/schemas/Money'
          description: Unit price (non-negative).
        alicuota_iva:
          $ref: '#/components/schemas/IvaRate'
          description: IVA rate applied to this line.
    TaxLineRequest:
      type: object
      required:
      - concepto
      - importe
      properties:
        concepto:
          type: string
          minLength: 1
          description: Tax concept name (e.g. "IIBB", "Tasa Municipal").
          example: IIBB
        importe:
          $ref: '#/components/schemas/Money'
          description: Tax amount (non-negative).
    InvoiceType:
      type: string
      enum:
      - '001'
      - '006'
      - '011'
      - '051'
      description: 'ARCA invoice type code (RG 4290/2018):

        - `001` — Factura A (RI → RI)

        - `006` — Factura B (RI → CF/Exento/Mono)

        - `011` — Factura C (Any → CF/Exento)

        - `051` — Factura A con leyenda

        '
    IvaRate:
      type: string
      enum:
      - Veintiuno
      - DiezComaCinco
      - Veintisiete
      - Cero
      - Exento
      description: 'ARCA IVA rate:

        - `Veintiuno` — 21% general

        - `DiezComaCinco` — 10.5% reduced

        - `Veintisiete` — 27% services/utilities

        - `Cero` — 0% (gravado a tasa cero)

        - `Exento` — exempt

        '
    ReceiptType:
      type: string
      enum:
      - 009
      - '015'
      description: 'ARCA receipt type code:

        - `009` — Recibo B (RI/Mono/Exento)

        - `015` — Recibo C (CF/Exento)

        '
    InvoiceStatus:
      type: string
      enum:
      - Activa
      - Anulada
      description: Invoice lifecycle status. Anulada is immutable terminal state.
    ReciboStatus:
      type: string
      enum:
      - Activo
      - Anulado
      description: Recibo lifecycle status.
    AdjustmentReason:
      type: string
      enum:
      - Return
      - Discount
      - Cancellation
      - Error
      - PostBillingDiscount
      - AdditionalCharge
      - PriceAdjustment
      - Interest
      - Other
      description: 'Reason for the adjustment:

        - For **Nota de Crédito**: Return, Discount, Cancellation, Error, PostBillingDiscount

        - For **Nota de Débito**: AdditionalCharge, PriceAdjustment, Interest, Other

        '
