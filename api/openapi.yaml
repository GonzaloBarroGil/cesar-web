          $ref: '#/components/schemas/UUID'
        code:
          $ref: '#/components/schemas/YYYYMM'
        start_date:
          $ref: '#/components/schemas/Date'
        end_date:
          $ref: '#/components/schemas/Date'
        due_date:
          $ref: '#/components/schemas/Date'
        status:
          $ref: '#/components/schemas/PeriodStatus'
