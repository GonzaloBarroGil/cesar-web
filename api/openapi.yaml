        consorcio_id:
          $ref: '#/components/schemas/UUID'
        period_code:
          $ref: '#/components/schemas/YYYYMM'
        unit_id:
          $ref: '#/components/schemas/UUID'
        percentage:
          $ref: '#/components/schemas/Percentage'
          description: 'Compensatory interest rate for this unit.

            Applied as total_unit_expenses × (percentage / 100).

            '
        description:
          type: string
          description: Reason for the compensatory interest.
        comments:
          type: string
          nullable: true
          description: Optional notes.
        created_at:
          type: string
          format: date-time
        created_by:
          $ref: '#/components/schemas/UUID'
    GenerateLiquidacionRequest:
      type: object
