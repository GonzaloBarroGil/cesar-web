        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
  /payments:
    post:
      summary: Create a payment
      description: 'Registers a new ACTIVE payment and auto-generates a linked Recibo B/C.

        Payment amount must be greater than 0.00 and payment date must not be

        in the future. For CASH payments without a voucher, a `[NO_VOUCHER]`

        warning is appended to the notes.

        '
      operationId: createPayment
      tags:
      - Payments
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Idempotency key to prevent duplicate submissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created with auto-generated Recibo B/C.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
    get:
      summary: List payments
      description: 'Returns payments filtered by optional query parameters. Supports

        filtering by unit, period, method, status, and pagination via

        `limit`/`offset`.

        '
      operationId: listPayments
      tags:
      - Payments
      parameters:
      - name: consorcio_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The consorcio ID (required for multi-tenant isolation).
      - name: unit_id
        in: query
        required: false
        schema:
          type: string
        description: Filter by unit functional ID (e.g., "UF-1A").
      - name: period_code
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/YYYYMM'
      - name: method
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PaymentMethod'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PaymentStatus'
      - name: include_tombstones
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
        description: Max records to return.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: Records to skip (pagination).
      responses:
        '200':
          description: List of payments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /payments/{id}:
    get:
      summary: Get a payment
      description: Retrieve a single payment by ID.
      operationId: getPayment
      tags:
      - Payments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Payment ID.
      responses:
        '200':
          description: Payment details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /payments/{id}/reverse:
    post:
      summary: Reverse a payment
      description: 'Creates a new REVERSED payment entry compensating the original. The

        original payment stays ACTIVE (append-only). The reversal copies the

        original''s amount, unit, period, and method but does not carry over

        the recibo or voucher.

        '
      operationId: reversePayment
      tags:
      - Payments
      security:
      - bearerAuth:
        - ADMIN
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Original payment ID to reverse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReversePaymentRequest'
      responses:
        '201':
          description: Reversal payment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /payments/unit/{unit_id}/balance:
