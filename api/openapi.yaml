        schema:
          type: string
        description: Unit functional ID (e.g., "UF-1A").
      - name: consorcio_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The consorcio ID.
      responses:
        '200':
          description: Payment history entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentHistoryEntry'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /incomes-outputs:
    post:
      summary: Create an income-output entry
      description: 'Creates a new ACTIVE entry. Amount must be > 0.00 and the direction must

        match the sub_type prefix (e.g., `INCOME` with `INCOME_RENT`). Temporary

        output sub_types auto-attach migration tags.

        '
      operationId: createEntry
      tags:
      - IncomesOutputs
      - Entries
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Idempotency key to prevent duplicate submissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntryRequest'
      responses:
        '201':
          description: Entry created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeOutputResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
    get:
      summary: List income-output entries
      description: 'Returns entries filtered by consorcio, period, direction, sub_type,

        status, date range, and tags.

        '
      operationId: listEntries
      tags:
      - IncomesOutputs
      - Entries
      parameters:
      - name: consorcio_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The consorcio ID.
      - name: period_code
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/YYYYMM'
      - name: direction
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FlowDirection'
      - name: sub_type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FlowSubType'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/IncomeOutputStatus'
      - name: date_from
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Inclusive start of date range.
      - name: date_to
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Inclusive end of date range.
      - name: tags
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Filter entries containing at least one of these tags.
        style: form
        explode: true
      responses:
        '200':
          description: List of entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncomeOutputResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /incomes-outputs/{entry_id}:
    get:
