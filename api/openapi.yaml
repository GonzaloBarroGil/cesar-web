      summary: Sign certificado de deuda
      description: 'Adds the administrator''s signature to the certificado, making it

        a legally enforceable executive title (CCC Art. 2048 ¶4).

        Requires ADMIN role.

        If the signature is a non-empty string, `is_executive_title` becomes true.

        '
      operationId: signCertificado
