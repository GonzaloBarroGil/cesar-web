      summary: List certificados by unit
      description: 'List all certificados de deuda for a given unidad funcional.

        The unit_id query parameter is required.

        '
      operationId: listCertificados
      parameters:
      - name: unit_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
        description: Unidad funcional UUID.
      responses:
        '200':
          description: List of certificados for the unit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCertificadosResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /debt/certificados/{id}:
    get:
      tags:
      - Debt
      - Certificados
      summary: Get certificado de deuda
      description: Retrieve a single certificado de deuda by its UUID.
      operationId: getCertificado
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
        description: Certificado UUID
      responses:
        '200':
          description: Certificado found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCertificadoResponse'
