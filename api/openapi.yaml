openapi: 3.1.0
info:
  title: CESAR — Consorcio Expense & Service Administration Runtime
  description: 'API for managing condominium consorcios under Argentine law.

    Implements CCC Art. 2044-2057, ARCA RG 4290/2018, and CABA DI-1146/24.

    Authentication via Bearer JWT with role-based access (ADMIN, ACCOUNTANT).'
  version: 0.1.0
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: http://localhost:3000
  description: Local development server
security:
- BearerAuth: []
tags:
- name: Consorcio
  description: 'Consorcio management: legal entities, units, owners, fiscal periods'
- name: Expenses
  description: 'Expense management: CRUD, approval workflow, providers, concepts, categories'
- name: Invoices
  description: 'ARCA-compliant electronic invoicing: Facturas A/B/C, Notas, Recibos'
- name: Debt
  description: Liquidacion calculation and Certificado de Deuda generation
- name: Payments
  description: Payment registration, reversal, and balance tracking
- name: IncomesOutputs
  description: Cash-flow module for income and output entries
- name: Auth
  description: Authentication endpoints for JWT login and user info retrieval
- name: Health
  description: Health check endpoint for service and dependency status
paths:
  /consorcios:
    post:
      tags:
      - Consorcio
      summary: Create a new consorcio (ADMIN)
      description: 'Registers a new condominium legal entity.  The CUIT must be a

        valid, unique 11-digit Argentine tax identifier.  On success the

        consorcio is created with status `ACTIVE`.

        '
      operationId: createConsorcio
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsorcioRequest'
      responses:
        '201':
          description: Consorcio created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsorcioResponse'
        '400':
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an ADMIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Duplicate CUIT or idempotency-key conflict.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Validation error (e.g. invalid CUIT checksum, empty razon_social,

            month out of range, negative round-off limit, interest rate out of range).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server or database error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Consorcio
      summary: List all consorcios
      description: Returns all consorcios with optional pagination.
      operationId: listConsorcios
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        description: Maximum records to return.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Records to skip (pagination).
      responses:
        '200':
          description: List of consorcios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsorcioResponse'
        '400':
          description: Malformed query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /consorcios/{id}:
    get:
      tags:
      - Consorcio
      summary: Retrieve a consorcio by ID
      description: Returns the full consorcio aggregate by its UUID.
      operationId: getConsorcio
      parameters:
      - name: id
        in: path
        required: true
        description: Consorcio UUID.
        schema:
          $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Consorcio found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsorcioResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Consorcio not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Consorcio
      summary: Update consorcio fields (ADMIN)
      description: 'Partial update.  Only the fields present in the request body are

        modified.  Set `admin_matricula` to `null` to clear it.

        '
      operationId: updateConsorcio
      parameters:
      - name: id
        in: path
        required: true
        description: Consorcio UUID.
        schema:
          $ref: '#/components/schemas/UUID'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConsorcioRequest'
      responses:
        '200':
          description: Consorcio updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsorcioResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an ADMIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Consorcio not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency-key conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation or business rule violation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /consorcios/{id}/ufs:
    put:
      tags:
      - Consorcio
      summary: Configure all UFs for a consorcio (ADMIN)
      description: 'Replaces all unidades funcionales for the given consorcio.

        The sum of `percentage` values across all UFs must equal exactly

        `100.00`.  At least one active UF is required.


        **CAUTION:** This is a full replacement, not a delta.

        '
      operationId: configureUfs
      parameters:
      - name: id
        in: path
        required: true
        description: Consorcio UUID.
        schema:
          $ref: '#/components/schemas/UUID'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureUfsRequest'
      responses:
        '201':
          description: UFs configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UfsResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an ADMIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Consorcio not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Conflict – duplicate UF code or idempotency-key conflict.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Business rule violation:

            - Percentages do not sum to exactly 100.00%.

            - No active UFs.

            - Invalid expense group.

            - Duplicate exemption.

            - Tenant is the same as owner.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /consorcios/{id}/propietarios:
    post:
      tags:
      - Consorcio
      - Propietarios
      summary: Register a new propietario (ADMIN)
      description: 'Registers an owner or tenant in the consorcio''s propietario registry.

        The `tax_id` combination of `type` + `value` must be unique within

        the consorcio.

        '
      operationId: registerPropietario
      parameters:
      - name: id
        in: path
        required: true
        description: Consorcio UUID.
        schema:
          $ref: '#/components/schemas/UUID'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPropietarioRequest'
      responses:
        '201':
          description: Propietario registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropietarioResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an ADMIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Consorcio not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate TaxId or idempotency-key conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Validation error – invalid email format, empty name, invalid

            iva_condition, or invalid signature_hash.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Consorcio
      - Propietarios
      summary: List all propietarios for a consorcio
      description: Returns all registered owners and tenants for the given consorcio.
      operationId: listPropietarios
      parameters:
      - name: id
        in: path
        required: true
        description: Consorcio UUID.
        schema:
          $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: List of propietarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropietarioListResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Consorcio not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /consorcios/{id}/propietarios/{tax_id}:
    get:
      tags:
      - Consorcio
      - Propietarios
      summary: Find propietario by tax identifier
      description: 'Looks up a propietario by raw tax-id string in the URL path.

        The server parses the digits and attempts to match against

        CUIT (11 digits), CUIL (11 digits), or DNI (8 digits).

        '
      operationId: findPropietarioByTaxId
      parameters:
      - name: id
        in: path
        required: true
        description: Consorcio UUID.
        schema:
          $ref: '#/components/schemas/UUID'
      - name: tax_id
        in: path
        required: true
        description: 'Raw numeric tax identifier.  The server strips non-digit

          characters and infers the type from length:

          - 11 digits → tries CUIT, then CUIL.

          - 8 digits  → DNI.

          '
        schema:
          type: string
          example: '20123456789'
      responses:
        '200':
          description: Propietario found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropietarioResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Consorcio or propietario not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /consorcios/{id}/periodos:
    post:
      tags:
      - Consorcio
      - Periods
      summary: Open a new fiscal period (ADMIN)
      description: 'Creates a new period with status `OPEN`.  Dates must satisfy:

        `start_date < end_date < due_date`.  Only one OPEN period is

        allowed per consorcio at any given time.  The `code` must be

        unique within the consorcio.

        '
      operationId: openPeriod
      parameters:
      - name: id
        in: path
        required: true
        description: Consorcio UUID.
        schema:
          $ref: '#/components/schemas/UUID'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenPeriodRequest'
      responses:
        '201':
          description: Period opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an ADMIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Consorcio not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Conflict – duplicate period code, another OPEN period already

            exists, or idempotency-key conflict.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Validation error – invalid YYYYMM code, invalid date ordering

            (end <= start or due < end), or other business rule violation.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /consorcios/{id}/periodos/{period_id}/close:
    put:
      tags:
      - Consorcio
      - Periods
      summary: Close an OPEN period (ADMIN)
      description: 'Transitions the period from `OPEN` to `CLOSED`.  A `closed_at`

        timestamp is set.  Once closed, charges are frozen and the period

        is ready for archiving.


        **State precondition:** period must be `OPEN`.

        '
      operationId: closePeriod
      parameters:
      - name: id
        in: path
        required: true
        description: Consorcio UUID.
        schema:
          $ref: '#/components/schemas/UUID'
      - name: period_id
        in: path
        required: true
        description: Period UUID.
        schema:
          $ref: '#/components/schemas/UUID'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Period closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an ADMIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Consorcio or period not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency-key conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Business rule violation – period is not `OPEN` (already closed,

            archived, or in a state that cannot transition to CLOSED).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /consorcios/{id}/periodos/{period_id}/archive:
    put:
      tags:
      - Consorcio
      - Periods
      summary: Archive a CLOSED period (ADMIN)
      description: 'Transitions the period from `CLOSED` to `ARCHIVED`.  Once archived,

        the period is immutable – no further modifications, charges,

        or liquidations are permitted.


        **State precondition:** period must be `CLOSED`.

        '
      operationId: archivePeriod
      parameters:
      - name: id
        in: path
        required: true
        description: Consorcio UUID.
        schema:
          $ref: '#/components/schemas/UUID'
      - name: period_id
        in: path
        required: true
        description: Period UUID.
        schema:
          $ref: '#/components/schemas/UUID'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Period archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an ADMIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Consorcio or period not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency-key conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Business rule violation – period is not `CLOSED` (still open

            or already archived).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /expenses:
    post:
      summary: Create an expense
      description: 'Creates one or more expense entries. For multi-term expenses (`total_terms > 1`),

        returns one entry per term. `ORDINARIA` expenses are auto-approved;

        `EXTRAORDINARIA` expenses start in `PENDING` status.

        '
      operationId: createExpense
      tags:
      - Expenses
      security:
      - bearerAuth:
        - ADMIN
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Idempotency key to prevent duplicate submissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseRequest'
      responses:
        '201':
          description: Expense(s) created successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
    get:
      summary: List expenses
      description: 'Returns expenses filtered by optional query parameters. Only returns the

        latest version of each expense. Tombstone entries are excluded unless

        `include_deleted=true`.

        '
      operationId: listExpenses
      tags:
      - Expenses
      parameters:
      - name: consorcio_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: period_code
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]{6}$
          description: YYYYMM format.
      - name: category_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: concept_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: provider_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - ORDINARIA
          - EXTRAORDINARIA
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Paginated list of expenses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseResponse'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /expenses/{id}/versions:
    get:
      summary: Get expense version history
      description: 'Returns all versions of an expense in ascending version order, forming

        the complete hash-chain audit trail.

        '
      operationId: getExpenseVersions
      tags:
      - Expenses
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Expense logical ID.
      responses:
        '200':
          description: List of all expense versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseResponse'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /expenses/{id}/tombstone:
    put:
      summary: Tombstone (soft-delete) an expense
      description: 'Logically deletes an expense by creating a new version with `tombstone=true`.

        Cannot tombstone an already deleted expense.

        '
      operationId: tombstoneExpense
      tags:
      - Expenses
      security:
      - bearerAuth:
        - ADMIN
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Expense logical ID.
      responses:
        '200':
          description: Tombstoned expense version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
  /expenses/{id}/approve:
    put:
      summary: Approve an extraordinary expense
      description: 'Transitions a `PENDING` extraordinary expense to `APPROVED`. Only

        applicable to expenses of type `EXTRAORDINARIA`.

        '
      operationId: approveExpense
      tags:
      - Expenses
      security:
      - bearerAuth:
        - ADMIN
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Expense logical ID.
      responses:
        '200':
          description: Approved expense.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
