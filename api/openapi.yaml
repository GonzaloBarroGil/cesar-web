      responses:
        '200':
          description: Financial summary for the period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialSummary'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /incomes-outputs/summary:
    get:
      summary: Get cross-period financial summary
      description: 'Returns financial summaries for a range of periods with cascading

        opening and closing balances. Each period shows income, output, net

        flow, opening balance, and closing balance.


        Response is a map of `period_code → FinancialSummary`.

        '
      operationId: getCrossPeriodSummary
      tags:
      - IncomesOutputs
      - Summaries
      parameters:
      - name: consorcio_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The consorcio ID.
      - name: start_period
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/YYYYMM'
        description: Inclusive start period (YYYYMM).
      - name: end_period
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/YYYYMM'
        description: Inclusive end period (YYYYMM).
      responses:
        '200':
          description: Map of period_code to financial summary.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/FinancialSummary'
                description: Period code (YYYYMM) → FinancialSummary.
                example:
                  '202601':
                    total_income:
                      amount: '50000.00'
                      currency: ARS
                    total_output:
                      amount: '120000.00'
                      currency: ARS
                    net_flow:
                      amount: '-70000.00'
                      currency: ARS
                    opening_balance:
                      amount: '15000.00'
                      currency: ARS
                    closing_balance:
                      amount: '-55000.00'
                      currency: ARS
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /health:
