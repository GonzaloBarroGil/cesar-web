                $ref: '#/components/schemas/GetLiquidacionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /debt/liquidaciones/{id}/issue:
    put:
      tags:
      - Debt
      - Liquidaciones
      summary: Issue a liquidación
      description: 'Transitions a liquidación from DRAFT to ISSUED status.

        Once issued, the liquidación becomes immutable for recalculation.

        Requires ADMIN role.

        Valid transitions: DRAFT → ISSUED.

        '
      operationId: issueLiquidacion
