    ReciboResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Recibo'
    LiquidacionStatus:
      type: string
      enum:
      - DRAFT
      - ISSUED
      - SETTLED
      - CANCELLED
      description: 'Liquidación lifecycle:

        - `DRAFT` — editable, can be recalculated

        - `ISSUED` — immutable, ready for billing

        - `SETTLED` — fully paid

        - `CANCELLED` — voided

        Valid transitions: DRAFT → ISSUED | CANCELLED; ISSUED → SETTLED | CANCELLED.

        '
    DistributionType:
      type: string
      enum:
      - PERCENTAGE
      - EQUAL
      - INDIVIDUAL
      description: 'How an expense is distributed across units:

        - `PERCENTAGE` — by unit''s prorrateo percentage (default)

        - `EQUAL` — split equally across non-exempt units

        - `INDIVIDUAL` — charged to specific unit(s) only

        '
    CertStatus:
      type: string
      enum:
      - VIGENTE
      - VENCIDO
      - EJECUTADO
      description: 'Certificado de Deuda lifecycle:

        - `VIGENTE` — currently valid

        - `VENCIDO` — past expiration date

        - `EJECUTADO` — presented for judicial enforcement

        '
    ExpenseAllocation:
      type: object
      required:
      - expense_id
      - expense_group
      - description
      - total_cost
      - distribution_type
      - unit_percentage_applied
      - unit_share
      properties:
        expense_id:
          $ref: '#/components/schemas/UUID'
          description: The expense record ID.
        expense_group:
          type: string
          description: Group the expense belongs to (e.g. "Servicios", "Mantenimiento").
        description:
          type: string
          description: Expense description.
        total_cost:
          $ref: '#/components/schemas/Money'
          description: Total cost of this expense before distribution.
        distribution_type:
          $ref: '#/components/schemas/DistributionType'
          description: How this expense was distributed.
        unit_percentage_applied:
          $ref: '#/components/schemas/Percentage'
          description: 'The percentage factor applied to compute this unit''s share.

            For PERCENTAGE distribution: the unit''s prorrateo.

            For EQUAL: 100/N.

            For INDIVIDUAL: 100% (or 0% if not charged).

            '
        unit_share:
          $ref: '#/components/schemas/Money'
          description: 'This unit''s share of the expense.

            Computed as total_cost × (unit_percentage_applied / 100).

            '
    PeriodBreakdownItem:
      type: object
      required:
      - period_code
      - amount
      properties:
        period_code:
          $ref: '#/components/schemas/YYYYMM'
          description: Fiscal period this debt component belongs to.
        amount:
          $ref: '#/components/schemas/Money'
          description: Debt amount for this period within the certificado.
    Liquidacion:
      type: object
      required:
      - id
      - consorcio_id
      - period_code
      - unit_id
      - previous_balance
      - expenses_breakdown
      - total_unit_expenses
      - compensatory_interest
      - punitive_interest
      - round_off
      - total_debt
      - payments_applied
      - current_balance
      - liquidacion_number
      - qr_code
      - status
      - hash
      - version
      - generated_at
      - created_at
      - tombstone
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        consorcio_id:
          $ref: '#/components/schemas/UUID'
        period_code:
          $ref: '#/components/schemas/YYYYMM'
          description: Fiscal period (e.g. 202606).
        unit_id:
          $ref: '#/components/schemas/UUID'
          description: Unidad funcional this liquidación applies to.
        previous_balance:
          $ref: '#/components/schemas/Money'
          description: 'Debt carried over from the prior period.

            I17/I18: latest ISSUED liquidación balance for this unit before this period.

            '
        expenses_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseAllocation'
          description: Per-expense allocation breakdown.
        total_unit_expenses:
          $ref: '#/components/schemas/Money'
          description: 'Sum of all expenses_breakdown[].unit_share (I1 invariant).

            '
        compensatory_interest:
          $ref: '#/components/schemas/Money'
          description: 'Interest awarded to the consorcio for late payment (I9).

            Computed as total_unit_expenses × (compensatory_rate / 100).

            '
        punitive_interest:
          $ref: '#/components/schemas/Money'
          description: 'Punitive interest on existing debt (I8).

            Computed as previous_balance × (monthly_punitive_rate / 100).

            Only applied when previous_balance > 0.

            '
        round_off:
          $ref: '#/components/schemas/Money'
          description: 'Rounding adjustment (± small amount, signed) to achieve whole cents.

            Must be within configurable limits.

            '
        total_debt:
          $ref: '#/components/schemas/Money'
          description: 'Total debt for this period (I5 invariant):

            previous_balance + total_unit_expenses + compensatory_interest + punitive_interest + round_off

            '
        payments_applied:
          $ref: '#/components/schemas/Money'
          description: Payments received against this liquidación.
        current_balance:
          $ref: '#/components/schemas/Money'
          description: 'Outstanding balance (I6 invariant):

            total_debt - payments_applied

            '
        liquidacion_number:
          type: string
          description: Unique liquidación number (e.g. "LC-202606-001").
        qr_code:
          type: string
          description: QR code for payment reference.
        status:
          $ref: '#/components/schemas/LiquidacionStatus'
        hash:
          type: string
          description: SHA-256 hash for immutable audit (P3).
        version:
          type: integer
          minimum: 1
          description: Version number incremented on each recalculation.
        generated_at:
          type: string
          format: date-time
          description: When this version was generated.
        issued_at:
          type: string
          format: date-time
          nullable: true
          description: When the liquidación was issued (populated on DRAFT→ISSUED).
        created_at:
          type: string
          format: date-time
        tombstone:
          type: boolean
          description: Soft-delete marker.
    CertificadoDeuda:
      type: object
      required:
      - id
      - consorcio_id
      - unit_id
      - total_debt
      - period_breakdown
      - issue_date
      - expires_at
      - administrator_signature
      - status
      - is_executive_title
      - source_liquidacion_hashes
      - hash
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        consorcio_id:
          $ref: '#/components/schemas/UUID'
        unit_id:
          $ref: '#/components/schemas/UUID'
          description: Unidad funcional that owes the debt.
        total_debt:
          $ref: '#/components/schemas/Money'
          description: Total certified debt amount.
        period_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/PeriodBreakdownItem'
          description: Period-by-period breakdown of the total debt.
        issue_date:
          type: string
          format: date
          description: Date the certificado was issued.
        expires_at:
          type: string
          format: date
          description: 'Expiration date. After this date the certificado becomes VENCIDO.

            Must be issued within 3 business days of the underlying liquidación.

            '
        administrator_signature:
          type: string
          description: 'Administrator''s digital signature.

            When non-empty, the certificado becomes an executive title (CCC Art. 2048 ¶4).

            '
        consejo_approval:
          type: string
          nullable: true
          description: Optional consejo de propietarios approval reference.
        status:
          $ref: '#/components/schemas/CertStatus'
        is_executive_title:
          type: boolean
          description: 'True when the certificado bears the administrator''s signature

            (and consejo approval if consejo exists), making it legally

            enforceable under CCC Art. 2048 ¶4 (I14 invariant).

            '
        source_liquidacion_hashes:
          type: array
          items:
            type: string
          description: SHA-256 hashes of the source liquidaciones for auditability.
        hash:
          type: string
          description: SHA-256 hash of this certificado for tamper-evidence.
    InterestTable:
      type: object
      required:
      - id
      - consorcio_id
      - period_code
      - annual_percentage
      - created_at
      - created_by
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        consorcio_id:
          $ref: '#/components/schemas/UUID'
        period_code:
          $ref: '#/components/schemas/YYYYMM'
          description: Period from which this rate is effective.
        annual_percentage:
          $ref: '#/components/schemas/Percentage'
          description: 'Annual punitive interest rate. Monthly rate = annual_percentage / 12.

            '
        created_at:
          type: string
          format: date-time
        created_by:
          $ref: '#/components/schemas/UUID'
    CompensatoryInterest:
      type: object
      required:
      - id
      - consorcio_id
      - period_code
