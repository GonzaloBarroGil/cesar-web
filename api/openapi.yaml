    SignCertificadoResponse:
      type: object
      required:
      - certificado
      properties:
        certificado:
          $ref: '#/components/schemas/CertificadoDeuda'
          description: Certificado with updated signature and executive title status.
    PaymentMethod:
      type: string
      enum:
      - CASH
      - TRANSFER
      - DEPOSIT
      - MERCADOPAGO
      - OTHER
      description: 'Payment method:

        - `CASH` — Cash (may or may not have a physical voucher).

        - `TRANSFER` — Bank / electronic transfer.

        - `DEPOSIT` — Bank deposit.

        - `MERCADOPAGO` — MercadoPago (Phase 2 integration).

        - `OTHER` — Any other method not listed.

        '
    PaymentStatus:
      type: string
      enum:
      - ACTIVE
      - REVERSED
      description: 'Lifecycle status. ACTIVE payments are valid and applied to debt.

        REVERSED payments are compensating entries (original stays ACTIVE).

        '
    CreatePaymentRequest:
      type: object
      required:
      - consorcio_id
      - unit_id
      - period_code
      - payment_date
      - amount
      - method
      properties:
        consorcio_id:
          $ref: '#/components/schemas/UUID'
        unit_id:
          $ref: '#/components/schemas/UUID'
          description: UUID of the UnidadFuncional making the payment.
        period_code:
          $ref: '#/components/schemas/YYYYMM'
        payment_date:
          $ref: '#/components/schemas/Date'
          description: Date the payment was made (must not be in the future).
        amount:
          $ref: '#/components/schemas/Money'
          description: Must be greater than 0.00 (I1).
        method:
          $ref: '#/components/schemas/PaymentMethod'
        has_voucher:
          type: boolean
          default: false
          description: Whether a physical/electronic voucher was provided.
        voucher_ref:
          type: string
          maxLength: 100
          description: Voucher reference number or identifier.
          example: COMP-001
        notes:
          type: string
          maxLength: 2000
          description: Free-text notes.
    ReversePaymentRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 'Reason for reversing the payment. Stored in the reversal''s notes

            as "Reversal of {original_id}: {reason}".

            '
          example: Error en monto
    PaymentResponse:
      type: object
      required:
      - id
      - consorcio_id
      - unit_id
      - period_code
      - payment_date
      - amount
      - method
      - has_voucher
      - status
      - hash
      - version
      - created_at
      - created_by
      - tombstone
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        consorcio_id:
          $ref: '#/components/schemas/UUID'
        unit_id:
          $ref: '#/components/schemas/UUID'
        period_code:
          type: string
          description: YYYYMM period code.
        payment_date:
          $ref: '#/components/schemas/Date'
        amount:
          $ref: '#/components/schemas/Money'
        method:
          $ref: '#/components/schemas/PaymentMethod'
        has_voucher:
          type: boolean
        voucher_ref:
          type: string
          description: Voucher reference, if provided.
        recibo_id:
          $ref: '#/components/schemas/UUID'
          description: Auto-generated Recibo B/C linked to this payment.
        notes:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        reversed_from:
          $ref: '#/components/schemas/UUID'
          description: If this is a reversal, the ID of the original payment.
        hash:
          $ref: '#/components/schemas/Hash'
          description: SHA-256 hash of core immutable fields.
        version:
          type: integer
          minimum: 1
          description: Monotonic version counter.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        created_by:
          $ref: '#/components/schemas/UUID'
        tombstone:
          type: boolean
    UnitBalanceResponse:
      type: object
      required:
      - total_debt
      - total_paid
      - outstanding
      - overpayment
      properties:
        total_debt:
          $ref: '#/components/schemas/Money'
          description: Total debt across all periods for this unit.
        total_paid:
          $ref: '#/components/schemas/Money'
          description: Sum of all ACTIVE payments made by this unit.
        outstanding:
          $ref: '#/components/schemas/Money'
          description: total_debt - total_paid (negative means overpayment).
        overpayment:
          $ref: '#/components/schemas/Money'
          description: Absolute overpayment amount when outstanding is negative, otherwise zero.
    PaymentHistoryEntry:
      type: object
      required:
      - payment_id
      - period_code
      - amount
      - method
      - payment_date
      - status
      - no_voucher_warning
      properties:
        payment_id:
          $ref: '#/components/schemas/UUID'
        period_code:
          type: string
          description: YYYYMM period the payment was applied to.
        amount:
          $ref: '#/components/schemas/Money'
        method:
          $ref: '#/components/schemas/PaymentMethod'
        payment_date:
          $ref: '#/components/schemas/Date'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        reversed_from:
          $ref: '#/components/schemas/UUID'
          description: If a reversal, points to the original payment.
        reversal_reason:
          type: string
          description: Reason for reversal (only for REVERSED entries).
        no_voucher_warning:
          type: boolean
          description: True when a CASH payment has no voucher (I4).
    FlowDirection:
      type: string
      enum:
      - INCOME
      - OUTPUT
      description: '- `INCOME` — Money received by the consorcio.

        - `OUTPUT` — Money paid by the consorcio.

        '
    FlowSubType:
      type: string
      enum:
      - INCOME_RENT
      - INCOME_ON_DEMAND_SERVICE
      - INCOME_INSURANCE
      - INCOME_OTHER
      - OUTPUT_SALARY_TEMP
      - OUTPUT_INVESTMENT_TEMP
      - OUTPUT_LEGAL_TEMP
      - OUTPUT_OTHER
      description: 'Classification of the cash movement. Prefix indicates expected direction.


        **Permanent incomes:**

        - `INCOME_RENT` — Rental income.

        - `INCOME_ON_DEMAND_SERVICE` — On-demand services.

        - `INCOME_INSURANCE` — Insurance reimbursements.

        - `INCOME_OTHER` — Other income.


        **Temporary outputs (Phase 1 bridge, will migrate to Phase 2):**

        - `OUTPUT_SALARY_TEMP` — Salary payments (→ Salary module).

        - `OUTPUT_INVESTMENT_TEMP` — Investments (→ Investment module).

        - `OUTPUT_LEGAL_TEMP` — Legal expenses (→ Legal module).

        - `OUTPUT_OTHER` — Other outputs.

        '
    IncomeOutputStatus:
      type: string
      enum:
      - ACTIVE
      - CANCELLED
      description: 'Lifecycle status. All entries start as ACTIVE.

        CANCELLED entries are excluded from financial summaries by default.

        '
    CreateEntryRequest:
      type: object
      required:
      - period_code
      - direction
      - sub_type
      - date
      - amount
      - description
      properties:
        period_code:
          $ref: '#/components/schemas/YYYYMM'
        direction:
          $ref: '#/components/schemas/FlowDirection'
          description: Must match the sub_type prefix.
        sub_type:
          $ref: '#/components/schemas/FlowSubType'
        date:
          $ref: '#/components/schemas/Date'
          description: Date of the cash movement (must be within period range).
        amount:
          $ref: '#/components/schemas/Money'
          description: Always positive; sign is determined by direction (I1).
        description:
          type: string
          minLength: 1
          maxLength: 1000
          description: Human-readable description (non-empty).
          example: Alquiler SUM marzo
        consorcio_id:
          $ref: '#/components/schemas/UUID'
          description: Optional if present in JWT token.
        invoice_id:
          $ref: '#/components/schemas/UUID'
          description: Optional link to an invoice.
        recibo_id:
          $ref: '#/components/schemas/UUID'
          description: Optional link to a receipt.
        tags:
          type: array
          items:
            type: string
            maxLength: 100
          description: Optional tags for filtering/migration tracking.
    IncomeOutputUpdate:
      type: object
      description: 'Partial update. Only provided fields are changed. Direction is immutable

        (not a field on this struct). An empty update (all fields omitted) is a no-op.

        '
      properties:
        amount:
          $ref: '#/components/schemas/Money'
          description: New amount (must be > 0.00 if provided).
        description:
          type: string
          minLength: 1
          maxLength: 1000
        date:
          $ref: '#/components/schemas/Date'
        invoice_id:
          oneOf:
          - $ref: '#/components/schemas/UUID'
          - type: 'null'
          description: Set to a new invoice ID, or `null` to unlink.
        recibo_id:
          oneOf:
          - $ref: '#/components/schemas/UUID'
          - type: 'null'
          description: Set to a new recibo ID, or `null` to unlink.
        tags:
          type: array
          items:
            type: string
        sub_type:
          $ref: '#/components/schemas/FlowSubType'
          description: Must match the entry's direction.
    IncomeOutputResponse:
      type: object
      required:
      - id
      - consorcio_id
      - period_code
      - direction
      - sub_type
      - date
      - amount
      - description
      - tags
      - status
      - hash
      - version
      - created_at
      - created_by
      - tombstone
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        consorcio_id:
          $ref: '#/components/schemas/UUID'
        period_code:
          type: string
          description: YYYYMM period code.
        direction:
          $ref: '#/components/schemas/FlowDirection'
        sub_type:
          $ref: '#/components/schemas/FlowSubType'
        date:
          $ref: '#/components/schemas/Date'
        amount:
          $ref: '#/components/schemas/Money'
          description: Always positive; sign is determined by direction.
        description:
          type: string
        invoice_id:
          $ref: '#/components/schemas/UUID'
        recibo_id:
          $ref: '#/components/schemas/UUID'
        tags:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/IncomeOutputStatus'
        hash:
          $ref: '#/components/schemas/Hash'
          description: SHA-256 hash of this version (append-only hash chain).
        version:
          type: integer
          minimum: 1
          description: Monotonically increasing version number.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        created_by:
          $ref: '#/components/schemas/UUID'
        tombstone:
          type: boolean
          description: True if this version is a cancellation tombstone.
    FinancialSummary:
      type: object
      required:
      - total_income
      - total_output
      - net_flow
      properties:
        total_income:
          $ref: '#/components/schemas/Money'
          description: Total income across the selected scope (ACTIVE only).
        total_output:
          $ref: '#/components/schemas/Money'
          description: Total output across the selected scope (ACTIVE only).
        net_flow:
          $ref: '#/components/schemas/Money'
          description: total_income - total_output.
        opening_balance:
          $ref: '#/components/schemas/Money'
          description: Balance carried forward from the previous period (cross-period only).
        closing_balance:
          $ref: '#/components/schemas/Money'
          description: opening_balance + net_flow (cross-period only).
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          description: Username for authentication.
          example: admin
        password:
          type: string
          minLength: 1
          format: password
          description: Password (not logged).
    LoginResponse:
      type: object
      required:
      - token
      - user
      properties:
        token:
          type: string
          description: JWT Bearer token.
        user:
          $ref: '#/components/schemas/UserInfo'
    UserInfo:
      type: object
      required:
      - id
      - username
      - role
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        username:
          type: string
          description: Authenticated username.
        role:
          type: string
          description: User role (ADMIN or ACCOUNTANT).
    MeResponse:
      type: object
      required:
      - user
      properties:
        user:
          $ref: '#/components/schemas/UserInfo'
    HealthResponse:
      type: object
      required:
      - status
      - dependencies
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          description: Overall health status.
        dependencies:
          $ref: '#/components/schemas/HealthDependencies'
    HealthDependencies:
      type: object
      required:
      - postgres
      - redis
      - nats
      properties:
        postgres:
          type: string
          enum:
          - ok
          - unhealthy
          description: PostgreSQL connection status.
        redis:
          type: string
          enum:
          - ok
          - unhealthy
          description: Redis connection status.
        nats:
          type: string
          enum:
          - ok
          - unhealthy
          description: NATS connection status.
