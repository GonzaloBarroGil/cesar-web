            At least one of factura_asociada_id or liquidacion_ref must be provided.

            '
    InvoiceResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Invoice'
    NotaCreditoResponse:
      type: object
      required:
      - data
