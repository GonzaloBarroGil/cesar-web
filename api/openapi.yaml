  /debt/certificados:
    post:
      tags:
      - Debt
      - Certificados
      summary: Generate certificado de deuda
      description: 'Generates a Certificado de Deuda from an issued liquidación.

        The certificado can serve as an executive title under CCC Art. 2048 ¶4

